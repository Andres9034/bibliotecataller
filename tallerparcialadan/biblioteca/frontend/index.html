<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Cloud Native</title>
  <script src="/env.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { margin-bottom: .25rem; } .sub { color: #6b7280; margin-top: 0; }
    section { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0; }
    input, button { padding: .5rem .6rem; margin: .2rem; border-radius: 6px; border: 1px solid #d1d5db; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; } button.sec { background: #6b7280; }
    table { width: 100%; border-collapse: collapse; } td, th { border-bottom: 1px solid #f3f4f6; padding: .4rem; text-align: left; }
    button.google { background: #fff; color: #1f2937; border: 1px solid #d1d5db; display: inline-flex; align-items: center; gap: .5rem; font-weight: 600; }
    .ok { color: #059669; font-weight: 600; } .err { color: #dc2626; font-weight: 600; } .hidden { display: none; }
  </style>
</head>
<body>
  <h1>📚 Biblioteca Cloud Native</h1>
  <p class="sub">Frontend → API Gateway (valida Firebase) → ms-libros → MongoDB</p>

  <section>
    <h3>Estado</h3>
    <p>Gateway: <span id="estadoGw">…</span> · Microservicio ms-libros: <span id="estadoLibros">…</span></p>
    <button class="sec" onclick="verEstado()">Actualizar estado</button>
    <button class="sec" onclick="probarSinToken()">Probar acceso SIN token</button>
    <p id="sinToken"></p>
  </section>

  <section id="login">
    <h3>Iniciar sesión (Firebase Authentication)</h3>
    <input id="email" type="email" placeholder="correo" />
    <input id="password" type="password" placeholder="contraseña" />
    <button onclick="login()">Entrar</button>
    <button class="sec" onclick="registrar()">Registrarme</button>
    <p style="margin:.6rem 0 .2rem;color:#6b7280">— o —</p>
    <button class="google" onclick="loginGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="18" height="18" />
      Iniciar sesión con Google
    </button>
    <p id="loginMsg"></p>
  </section>

  <div id="app" class="hidden">
    <p>Sesión: <b id="usuario"></b>
      <button class="sec" onclick="logout()">Salir</button>
      <button class="sec" onclick="copiarToken()">Copiar mi token</button></p>

    <section>
      <h3>Registrar libro</h3>
      <input id="titulo" placeholder="Título" />
      <input id="autor" placeholder="Autor" />
      <input id="anio" type="number" placeholder="Año" style="width:90px" />
      <button onclick="crearLibro()">Registrar</button>
      <p id="librosMsg"></p>
    </section>

    <section>
      <h3>Libros registrados <button class="sec" onclick="cargarLibros()">Recargar</button></h3>
      <table>
        <thead><tr><th>Título</th><th>Autor</th><th>Año</th><th>Registrado por</th><th></th></tr></thead>
        <tbody id="libros"></tbody>
      </table>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut,
      GoogleAuthProvider, signInWithPopup }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const ENV = window.__ENV__;
    const API = ENV.API_URL; // http://localhost:8080/api
    const auth = getAuth(initializeApp({
      apiKey: ENV.FIREBASE_API_KEY,
      authDomain: ENV.FIREBASE_AUTH_DOMAIN,
      projectId: ENV.FIREBASE_PROJECT_ID,
    }));

    const $ = (id) => document.getElementById(id);
    const msg = (id, texto, ok = true) => { $(id).textContent = texto; $(id).className = ok ? 'ok' : 'err'; };

    async function api(ruta, opciones = {}) {
      const token = await auth.currentUser.getIdToken();
      const r = await fetch(`${API}${ruta}`, {
        ...opciones,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      });
      const data = r.status === 204 ? null : await r.json().catch(() => null);
      if (!r.ok) throw new Error(data?.error || `Error ${r.status}`);
      return data;
    }

    window.login = async () => {
      try { await signInWithEmailAndPassword(auth, $('email').value, $('password').value); msg('loginMsg', 'Sesión iniciada'); }
      catch (e) { msg('loginMsg', e.message, false); }
    };
    window.registrar = async () => {
      try { await createUserWithEmailAndPassword(auth, $('email').value, $('password').value); msg('loginMsg', 'Usuario creado'); }
      catch (e) { msg('loginMsg', e.message, false); }
    };
    window.loginGoogle = async () => {
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await signInWithPopup(auth, provider);
        msg('loginMsg', 'Sesión iniciada con Google');
      } catch (e) { msg('loginMsg', e.message, false); }
    };
    window.logout = () => signOut(auth);
    window.copiarToken = async () => {
      await navigator.clipboard.writeText(await auth.currentUser.getIdToken());
      alert('Token copiado (válido 1 hora)');
    };

    window.verEstado = async () => {
      try {
        const r = await fetch(API.replace(/\/api$/, '') + '/health').then((x) => x.json());
        $('estadoGw').innerHTML = '<span class="ok">up</span>';
        const s = r.microservicios.libros;
        $('estadoLibros').innerHTML = `<span class="${s === 'up' ? 'ok' : 'err'}">${s}</span>`;
      } catch {
        $('estadoGw').innerHTML = '<span class="err">down</span>';
        $('estadoLibros').innerHTML = '<span class="err">desconocido</span>';
      }
    };

    window.probarSinToken = async () => {
      const r = await fetch(`${API}/libros`);
      const d = await r.json();
      msg('sinToken', `Respuesta sin token: HTTP ${r.status} – ${d.error}`, false);
    };

    window.cargarLibros = async () => {
      try {
        const libros = await api('/libros');
        $('libros').innerHTML = libros.map((l) => `<tr><td>${l.titulo}</td><td>${l.autor}</td><td>${l.anio ?? ''}</td>
          <td>${l.registrado_por ?? ''}</td><td><button class="sec" onclick="borrar('${l._id}')">Eliminar</button></td></tr>`).join('');
        msg('librosMsg', '');
      } catch (e) { msg('librosMsg', e.message, false); }
      verEstado();
    };

    window.crearLibro = async () => {
      try {
        await api('/libros', { method: 'POST', body: JSON.stringify({ titulo: $('titulo').value, autor: $('autor').value, anio: $('anio').value }) });
        msg('librosMsg', 'Libro registrado');
        $('titulo').value = $('autor').value = $('anio').value = '';
        cargarLibros();
      } catch (e) { msg('librosMsg', e.message, false); }
    };

    window.borrar = async (id) => {
      try { await api(`/libros/${id}`, { method: 'DELETE' }); cargarLibros(); }
      catch (e) { msg('librosMsg', e.message, false); }
    };

    onAuthStateChanged(auth, (u) => {
      $('app').classList.toggle('hidden', !u);
      $('login').classList.toggle('hidden', !!u);
      if (u) { $('usuario').textContent = u.email; cargarLibros(); }
    });
    verEstado();
  </script>
</body>
</html>
